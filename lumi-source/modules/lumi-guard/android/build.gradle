plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.lumi.guard'
version = '1.0.0'

android {
  namespace "app.lumi.guard"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles "consumer-rules.pro"
  }
  lint {
    abortOnError false
  }
}
